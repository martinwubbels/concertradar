/* Concertstatussen: betekenisvolle kleuren plus tekst, geen kleur-only signalen. */
:root{--ticket:#f7c76a;--ticket-bg:#2e261a;--ticket-border:#b98235;--interested:#91c8ff;--interested-bg:#162c3c;--interested-border:#477da8;--neutral:#99a8b8;--neutral-bg:#1b2630}
body{background:#0b121b}
.nav button{transition:background .15s,border-color .15s}
.nav button[data-tab="booked"],.nav button[data-tab="dashboard"]{border-color:#886332;color:#ffd68e}
.nav button.active[data-tab="booked"],.nav button.active[data-tab="dashboard"]{background:#f7c76a;border-color:#f7c76a;color:#20170c}
.nav button[data-tab="favorites"]{color:#b5dbff}
.nav button.active[data-tab="favorites"]{background:#96c9f2;color:#0d2636}
.event.concert-booked,.dash-card.concert-booked,.personal-row.concert-booked{background:linear-gradient(110deg,#322a1b,#242320 68%,#1c2630);border:2px solid var(--ticket-border);box-shadow:inset 4px 0 0 var(--ticket),0 5px 22px #0003}
.event.concert-booked .datebox{background:#624723;color:#fff4d5}
.event.concert-booked .datebox span{color:#ffe2a5}
.event.concert-interested,.personal-row.concert-interested,.discovery-card.concert-interested{background:linear-gradient(110deg,#182f44,#15232f);border:1px solid var(--interested-border);box-shadow:inset 4px 0 0 var(--interested)}
.event.concert-rejected,.personal-row.concert-rejected,.discovery-card.concert-rejected{background:#151c24;border-color:#394450;opacity:.83}
.status-strip{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.5px;font-weight:850;padding:5px 9px;border-radius:6px;margin:0 0 9px;border:1px solid transparent}
.status-strip.concert-booked{background:var(--ticket);color:#2b1a04;border-color:#ffdfa3}
.status-strip.concert-interested{background:var(--interested-bg);color:#c0e1ff;border-color:var(--interested-border)}
.status-strip.concert-rejected{background:#2d3843;color:#d2d9df;border-color:#4c5b69}
.event .tag.high{background:#284839;color:#c6f9dd}
.event.concert-booked .tag.high{background:#5b4322;color:#ffe6ac;border-color:#94632d}
.actions button.status-booked-button{border-color:#a87b39;color:#ffe0a4}
.actions button.status-booked-button.selected{background:var(--ticket);color:#20170c;border-color:var(--ticket);font-weight:850}
.actions button[data-action="interested"].selected{background:#93c9f1;color:#12273d}
.actions button[data-action="rejected"].selected{background:#667482;color:#fff}
.taste-small{margin-top:6px;font-size:12px;color:#a8d8ec}
.taste-small strong{color:#c8f4ed;font-size:14px}
.taste-panel{padding:19px;border:1px solid #3b5665;border-radius:15px;background:#172532;line-height:1.6}
.taste-genre{background:#28433f;color:#d0f7dc}
.stat:nth-child(3){border:1px solid #b38a45;background:linear-gradient(130deg,#3c301e,#242721)}
.stat:nth-child(3) strong{color:#ffdf9c}
.calendar-booked{background:#f1c77e!important;color:#20180b!important;font-weight:750}
.calendar-interested{background:#a4cdf1!important;color:#102b44!important}
.legend-line{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0 15px;font-size:12px}
.legend-item{border-radius:6px;padding:5px 8px;border:1px solid}
.legend-booked{background:#f7c76a;color:#241603;border-color:#ad8246}
.legend-interested{background:#a4cdf1;color:#142a3b;border-color:#5883aa}
.legend-normal{background:#293945;color:#e1eaf0;border-color:#506679}
@media(max-width:720px){.event.concert-booked{border-width:2px}.status-strip{font-size:10px}}

async function fetchArtistPhoto(name){
  if(photoCache[name]&&Date.now()-photoCache[name].checked<30*86400000)return;
  const api='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('intitle:"'+name+'" musician band')+'&gsrlimit=4&prop=pageimages|info&pithumbsize=500&inprop=url&format=json&origin=*';
  try{
    const res=await fetch(api,{mode:'cors'});if(!res.ok)throw Error('HTTP '+res.status);
    const json=await res.json();const pages=Object.values(json.query?.pages||{});
    const norm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');
    const exact=pages.find(p=>norm(p.title)===norm(name));
    const page=exact||pages.find(p=>norm(p.title).startsWith(norm(name))&&/band|musician|singer|rapper|group|artist/i.test(p.title));
    photoCache[name]={url:page?.thumbnail?.source||'',checked:Date.now(),source:page?.fullurl||''};savePhotoCache();
    document.querySelectorAll('[data-artist]').forEach(node=>{if(node.dataset.artist===name&&!node.querySelector('img')&&photoCache[name].url){let im=document.createElement('img');im.src=photoCache[name].url;im.alt='Artiestenfoto '+name;im.loading='lazy';im.onerror=()=>im.remove();node.replaceChildren(im)}});
  }catch(e){/* Browser kan netwerkverzoeken blokkeren; handmatige fotolink blijft mogelijk. */}
}
function startPhotoFetch(){

  let index=0;async function worker(){while(index<names.length){const name=names[index++];await fetchArtistPhoto(name)}}
  Promise.all(Array.from({length:3},worker)).finally(()=>{photoFetchStarted=false});
}

const TASTE_BASE={americana:0.28,country:0.27,roots:0.24,folk:0.14,soul:0.13,blues:0.12,"singer-songwriter":0.16};
function tasteGenres(event){
 const genre=String(event.genre||'').toLowerCase();
 return [...new Set(genre.split(/[\/,&+]| en /).map(x=>x.trim()).filter(x=>x&&x!=='onbekend'))];
}
function tasteSignals(){
 const examples=[];
 for(const e of [...all(),...discoveryEvents]){
   const status=statusOf(e),review=assessments[e.id];
   const dimensions=[['voice',0.32],['lyrics',0.32],['live',0.13],['overall',0.23]]
       .filter(([key])=>Number.isFinite(Number(review?.[key]))&&Number(review[key])>=1&&Number(review[key])<=10);
   const sum=dimensions.reduce((n,[,w])=>n+w,0);
   const reviewScore=sum?dimensions.reduce((n,[key,w])=>n+Number(review[key])*w,0)/sum:null;
   let signal=0;
   if(status==='interested')signal+=0.9;
   // Booking indicates intention, not necessarily musical satisfaction.
   if(status==='booked')signal+=0.65;
   if(reviewScore!==null)signal+=(reviewScore-6)*0.85;
   if(!signal||(!tasteGenres(e).length&&!e.match))continue;
   examples.push({e,signal,review:reviewScore});
 }
 return examples;
}
function tasteProfile(){
 const genres={};
 const signals=tasteSignals();
 for(const {e,signal} of signals){
   for(const g of tasteGenres(e)){
     const key=g.toLowerCase();
     const part=genres[key]||{sum:0,count:0};
     part.sum+=signal;part.count++;genres[key]=part;
   }
 }
 const sorted=Object.entries(genres).map(([genre,o])=>({genre,score:o.sum/Math.sqrt(o.count+1),count:o.count}))
   .sort((a,b)=>b.score-a.score);
 return {examples:signals.length,genres:sorted};
}
function tasteResult(e){
 const genres=tasteGenres(e);
 const profile=tasteProfile();
 const learned=new Map(profile.genres.map(x=>[x.genre,x]));
 const baseline=genres.reduce((sum,g)=>sum+(TASTE_BASE[g]||0),0);
 let learnedValue=0;
 const reasons=[];
 for(const g of genres){
   const x=learned.get(g);
   if(!x)continue;
   learnedValue+=Math.max(-1.25,Math.min(1.25,x.score*.48));
   if(x.score>.3)reasons.push(g);
 }
 // Similarity to known music references is used only for explicitly authored match descriptions.
 const likedArtists=[...tasteSignals()].filter(x=>x.signal>.8).map(x=>String(x.e.name||'').toLowerCase());
 const comparable=String(e.match||'').toLowerCase();
 if(likedArtists.some(x=>x.length>5&&comparable.includes(x)))learnedValue+=.35;
 const editorial=Number.isFinite(Number(e.quality))?Number(e.quality):7;
 const personal=Math.max(1,Math.min(10,editorial+baseline+Math.max(-2,Math.min(1.7,learnedValue))));
 return {score:Math.round(personal*10)/10,signals:profile.examples,reason:reasons.slice(0,3).join(', '),source:profile.examples?'Persoonlijke inschatting':'Startprofiel'};
}

const NL_MONTHS={jan:1,feb:2,mrt:3,mar:3,apr:4,mei:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dec:12};
const NL_DAYS={zo:0,ma:1,di:2,wo:3,do:4,vr:5,za:6};
function inferDutchEventDate(dayText,monthText,weekDay){
 const day=Number(dayText),month=NL_MONTHS[String(monthText||'').toLowerCase().replace('.','')];
 if(!month||day<1||day>31)return '';
 const currentYear=new Date().getFullYear(),now=new Date();
 const days=[];
 for(let year=currentYear;year<=currentYear+2;year++){
   const d=new Date(year,month-1,day,12);
   if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day)continue;
   if(d.getTime()<now.getTime()-86400000)continue;
   if(weekDay&&NL_DAYS[weekDay]!==d.getDay())continue;
   days.push(d);
 }
 if(!days.length)return '';
 const d=days[0];
 return d.getFullYear()+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
function parseMetropoolVisibleText(content,heading,sourceUrl){

 const text=String(content||'').replace(/\u00a0/g,' ').slice(0,80000);
 const name=String(heading||'').replace(/\s+\|\s+Metropool.*$/i,'').trim();
 const short=text.match(/\b(?:(ma|di|wo|do|vr|za|zo)\s+)?(\d{1,2})\s+(jan|feb|mrt|mar|apr|mei|jun|jul|aug|sep|okt|oct|nov|dec)\b/i);
 const longDate=text.match(/\b(\d{1,2})\s+(januari|februari|maart|april|mei|juni|juli|augustus|september|oktober|november|december)\s+(20\d{2})\b/i);
 const longMonths={januari:1,februari:2,maart:3,april:4,mei:5,juni:6,juli:7,augustus:8,september:9,oktober:10,november:11,december:12};
 let date='',inferred=false;
 if(longDate){
   const n=longMonths[longDate[2].toLowerCase()];
   date=longDate[3]+'-'+String(n).padStart(2,'0')+'-'+String(Number(longDate[1])).padStart(2,'0');
 }else if(short){
   date=inferDutchEventDate(short[2],short[3],short[1]?.toLowerCase());
   inferred=Boolean(date);
 }
 // Prefer the main act over door opening / support schedule.
 const timeMatch=text.match(/Aanvang\s+hoofdact\s*(\d{1,2}:\d{2})/i)
   ||text.match(/Aanvang\s+(?!voorprogramma)(\d{1,2}:\d{2})/i);
 const location=text.match(/Locatie[ \t]+([^\n\r]{2,110})/i);
 let venue='',city='';
 if(location){
   let part=location[1].split(/\b(?:Genre|Tijdschema|Bekijk menukaart|Rijd samen|Tickets|Prijs)\b/i)[0].trim();
   part=part.replace(/\s+(?:Tickets|Prijs|Voorverkoop).*$/i,'');
   const m=part.match(/^(.{2,65}?),\s*(Hengelo|Enschede|Almelo)\b/i);
   if(m){venue=m[1].trim();city=m[2];}
 } 
 if(!city){
   const matched=text.match(/\b(?:Hengelo|Enschede|Almelo)\b/);
   if(matched)city=matched[0];
 }
 if(!venue)venue='Metropool';
 const priceMatch=text.match(/Voorverkoop\s*€\s*(\d{1,4}(?:[,.]\d{1,2})?)/i);
 const price=priceMatch?Number(priceMatch[1].replace(',','.')):null;
 const genreMatch=text.match(/Genre[ \t]+([^\n\r]{3,60})/i);
 const genre=genreMatch?genreMatch[1].split(/\b(?:Bekijk menukaart|Tijdschema|Locatie|Tickets)\b/i)[0].trim():'';
 if(!name&&!date)return null;
 return {name,date,time:timeMatch?.[1]||'',venue,city,price:Number.isFinite(price)?price:null,
   genre,sourceUrl,url:sourceUrl,source_name:'Metropool (concertpagina)',review_required:true,
   date_inferred:inferred};
}

async function importConcertFromUrl(url){

function calendarIcs(){
  const escape=x=>String(x??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const events=all().filter(e=>statusOf(e)==='booked'||statusOf(e)==='interested');
  const parts=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ConcertRadar//NL','CALSCALE:GREGORIAN','X-WR-CALNAME:ConcertRadar'];
  for(const e of events){
    const dt=e.date.replaceAll('-','');
    // DATE (all-day) avoids guessing an event's start time or timezone.
    const next=new Date(e.date+'T12:00:00Z');next.setUTCDate(next.getUTCDate()+1);
    const dtend=next.toISOString().slice(0,10).replaceAll('-','');
    parts.push('BEGIN:VEVENT','UID:'+escape(e.id)+'@concertradar.local','DTSTAMP:'+now,
      'DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+dtend,
      'SUMMARY:'+escape(e.name),'LOCATION:'+escape(e.venue+', '+e.city),
      'DESCRIPTION:'+escape((statusOf(e)==='booked'?'Kaarten gekocht':'Interessant')+(e.note?'\n'+e.note:'')+'\n'+(e.sourceUrl||e.url||'')),
      'END:VEVENT');
  }
  parts.push('END:VCALENDAR');
  return parts.join('\r\n')+'\r\n';
}
function downloadText(filename,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

se, gebruikersaccount, automatische scan en notificaties.</p></div></div><h2 class="sectiontitle">Eigen concerten toevoegen</h2><p class="notice">Gebruik het tabblad Concert toevoegen. Je kunt daar direct aangeven dat je kaarten hebt gekocht.</p><button class="btn primary" data-tab="add">Concert toevoegen</button><p class="notice">Privacy: deze versie bewaart keuzes alleen in je huidige browser. Op een ander apparaat zie je ze niet automatisch. Exporteer je lijst als back-up.</p>`;}

let cloudClient=null,cloudUser=null,cloudReady=false,cloudConfigured=false,cloudStatus='Cloudsync is nog niet ingesteld.';
let cloudPushTimer=null,cloudPulling=false,cloudPushing=false;
function cloudMarkup(){
 return '<h2 class="sectiontitle">Synchronisatie tussen apparaten</h2>'+
 '<p class="notice">Optioneel: een eigen privédatabase. Je concerten blijven lokaal werken als je geen cloud koppelt. Persoonlijke gegevens komen nooit in de openbare GitHub-repository.</p>'+
 '<div class="flow"><strong>Verbinding</strong><p class="muted">'+h(cloudStatus)+'</p>'+
 (cloudUser?'<p>Aangemeld als '+h(cloudUser.email||'gebruiker')+'</p><div class="toolbar"><button class="btn primary" id="cloudNow">Nu synchroniseren</button><button class="btn" id="cloudLogout">Afmelden</button></div>':
 '<label>E-mailadres<input type="email" id="cloudEmail" placeholder="jouw@emailadres.nl"></label><p><button class="btn primary" id="cloudLogin">Stuur aanmeldlink</button></p>')+
 '<p class="muted">Gebruik hetzelfde e-mailadres op Android en Windows. Maak eerst een JSON-back-up. Cloudsync werkt pas nadat je het gratis databaseproject hebt ingesteld.</p>'+
 '<p><a href="https://github.com/martinwubbels/concertradar/blob/main/docs/SYNCHRONISATIE.md" target="_blank" rel="noopener noreferrer">Handleiding voor veilige installatie</a></p></div>';
}
function cloudSnapshot(){return {flags,extra,assessments,settings:appSettings};}
function mergeCloudEntries(local,remote){
 const out={...(remote||{})};
 for(const [id,value] of Object.entries(local||{})){
   const prior=out[id];
   const left=Date.parse(value?.updated_at||'')||0,right=Date.parse(prior?.updated_at||'')||0;
   if(!prior||left>=right)out[id]=value;
 }
 return out;
}
function mergeCloudEvents(local,remote){
 const out=new Map((Array.isArray(remote)?remote:[]).filter(x=>x?.id).map(x=>[x.id,x]));
 for(const value of Array.isArray(local)?local:[]){
   if(!value?.id)continue;
   const prior=out.get(value.id);
   if(!prior||(Date.parse(value.updated_at||'')||0)>=(Date.parse(prior.updated_at||'')||0))out.set(value.id,value);
 }
 return [...out.values()];
}
async function cloudConnect(){
 if(cloudClient)return true;
 try{
   const resp=await fetch('./data/cloud-config.json',{cache:'no-store'});
   if(!resp.ok)throw Error('Configuratie niet bereikbaar');
   const config=await resp.json();
   if(!config.enabled||!config.url||!config.anonKey){
     cloudStatus='Nog niet geactiveerd. Volg de installatiehandleiding voor een eigen privédatabase.';
     return false;
   }
   const origin=new URL(config.url);
   if(origin.protocol!=='https:'||!origin.hostname.endsWith('.supabase.co'))throw Error('Ongeldig databaseadres');
   const lib=await import('https://esm.sh/@supabase/supabase-js@2');
   cloudClient=lib.createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   const {data,error}=await cloudClient.auth.getSession();
   if(error)throw error;
   cloudUser=data.session?.user||null;
   cloudStatus=cloudUser?'Aangemeld. Cloudgegevens worden gecontroleerd.':'Database gereed. Meld je aan via e-mail.';
   cloudClient.auth.onAuthStateChange((event,session)=>{
      const before=cloudUser?.id;
      cloudUser=session?.user||null;
      if(cloudUser&&!cloudReady&&before!==cloudUser.id)setTimeout(()=>cloudPull(),0);
      if(!cloudUser){cloudReady=false;cloudStatus='Afgemeld';if(state.tab==='sync')render();}
   });
   if(cloudUser)await cloudPull();
   return true;
 }catch(e){cloudStatus='Cloud niet bereikbaar: '+String(e.message||e);cloudClient=null;return false}
}
async function cloudPull(){
 if(!cloudClient||!cloudUser||cloudPulling||cloudPushing)return;
 cloudPulling=true;
 try{
   const {data,error}=await cloudClient.from('concertradar_user_state').select('payload').eq('user_id',cloudUser.id).maybeSingle();
   if(error)throw error;
   if(data?.payload){
     cloudReady=false;
     flags=mergeCloudEntries(flags,data.payload.flags);
     assessments=mergeCloudEntries(assessments,data.payload.assessments);
     extra=mergeCloudEvents(extra,data.payload.extra);
     appSettings={...(data.payload.settings||{}),...appSettings};
     persist();
   }
   cloudReady=true;
   cloudStatus='Verbonden en bijgewerkt om '+new Date().toLocaleTimeString('nl-NL');
   await cloudPush();
   if(state.tab==='sync'||state.tab==='dashboard'||state.tab==='booked'||state.tab==='history'||state.tab==='calendar')render();
 }catch(e){cloudStatus='Cloudophalen mislukt, lokaal bewaard: '+String(e.message||e)}
 finally{cloudPulling=false}
}
function scheduleCloudPush(){
 if(!cloudReady||!cloudUser)return;
 if(cloudPushTimer)clearTimeout(cloudPushTimer);
 cloudPushTimer=setTimeout(()=>{cloudPushTimer=null;cloudPush()},1800);
}
async function cloudPush(){
 if(!cloudReady||!cloudClient||!cloudUser||cloudPushing)return;
 cloudPushing=true;
 try{
   const {error}=await cloudClient.from('concertradar_user_state').upsert({
     user_id:cloudUser.id,payload:cloudSnapshot(),updated_at:new Date().toISOString()
   },{onConflict:'user_id'});
   if(error)throw error;
   cloudStatus='In de privécloud opgeslagen om '+new Date().toLocaleTimeString('nl-NL');
 }catch(e){cloudStatus='Upload mislukt. Lokale gegevens bewaard: '+String(e.message||e)}
 finally{cloudPushing=false;if(state.tab==='sync')render()}
}
async function cloudLogin(){
 const email=String(document.getElementById('cloudEmail')?.value||'').trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Vul een geldig e-mailadres in.');return;}
 if(!await cloudConnect()){render();return;}
 const {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
 cloudStatus=error?'Aanmelden mislukt: '+error.message:'Controleer je e-mail. Open de aanmeldlink op dit apparaat.';
 render();
}
function wireCloud(){
 document.getElementById('cloudLogin')?.addEventListener('click',cloudLogin);
 document.getElementById('cloudNow')?.addEventListener('click',async()=>{await cloudPull();render();});
 document.getElementById('cloudLogout')?.addEventListener('click',async()=>{
   if(cloudClient)await cloudClient.auth.signOut();
   cloudUser=null;cloudReady=false;cloudStatus='Afgemeld';render();
 });
}
