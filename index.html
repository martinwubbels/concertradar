const KEY='concertradar-v1';

let catalogLoaded=false;
async function loadPublishedData(){
  if(location.protocol==='file:')return;
  try{
    const [eventsResponse,photosResponse,discoveriesResponse]=await Promise.all([
      fetch('./data/concerts.json',{cache:'no-store'}),
      fetch('./data/photos.json',{cache:'no-store'}),
      fetch('./data/new-discoveries.json',{cache:'no-store'})
    ]);
    if(eventsResponse.ok){
      const data=await eventsResponse.json();
      if(Array.isArray(data.events)){
        liveEvents=data.events.filter(e=>e && typeof e.id==='string' && typeof e.name==='string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date||''));
        lastCatalogUpdate=data.updated_at||'';
        catalogLoaded=true;
        catalogError=liveEvents.length?'':'De centrale lijst bevat geen geldige concertgegevens.';
      }
    }
    if(!eventsResponse.ok){catalogError='De centrale concertlijst kan niet worden geladen (HTTP '+eventsResponse.status+').';}
    if(photosResponse.ok){
      const data=await photosResponse.json();
      officialPhotos=data.photos||{};
    }
    if(discoveriesResponse.ok){
      const data=await discoveriesResponse.json();
      discoveryEvents=Array.isArray(data.events)?data.events.filter(e=>e && e.name && e.date && e.url):[];
      discoveriesUpdated=data.updated_at||'';
    }
    render();
    startPhotoFetch();
  }catch(e){catalogError='De centrale concertlijst is tijdelijk niet bereikbaar.';render();console.warn('Centrale concertlijst niet bereikbaar, ingebouwde lijst blijft beschikbaar.',e)}
}
const PHOTO_KEY='concertradar-photo-cache-v1';
let photoCache={};try{photoCache=JSON.parse(localStorage.getItem(PHOTO_KEY)||'{}')}catch{}
const cleanArtist=e=>(e.spotify||e.name).split(' + ')[0].split(' & Friends')[0].split(' & ')[0].trim();
const photoOf=e=>e.image||officialPhotos[e.id]?.url||photoCache[cleanArtist(e)]?.url||'';
const savePhotoCache=()=>{try{localStorage.setItem(PHOTO_KEY,JSON.stringify(photoCache))}catch{}};
let photoFetchStarted=false;
async function fetchArtistPhoto(name){
  if(photoCache[name]&&Date.now()-photoCache[name].checked<30*86400000)return;
  const api='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('intitle:"'+name+'" musician band')+'&gsrlimit=4&prop=pageimages|info&pithumbsize=500&inprop=url&format=json&origin=*';
  try{
    const res=await fetch(api,{mode:'cors'});if(!res.ok)throw Error('HTTP '+res.status);
    const json=await res.json();const pages=Object.values(json.query?.pages||{});
    const norm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');
    const exact=pages.find(p=>norm(p.title)===norm(name));
    const page=exact||pages.find(p=>norm(p.title).startsWith(norm(name))&&/band|musician|singer|rapper|group|artist/i.test(p.title));
    photoCache[name]={url:page?.thumbnail?.source||'',checked:Date.now(),source:page?.fullurl||''};savePhotoCache();
    document.querySelectorAll('[data-artist]').forEach(node=>{if(node.dataset.artist===name&&!node.querySelector('img')&&photoCache[name].url){let im=document.createElement('img');im.src=photoCache[name].url;im.alt='Artiestenfoto '+name;im.loading='lazy';im.onerror=()=>im.remove();node.replaceChildren(im)}});
  }catch(e){/* Browser kan netwerkverzoeken blokkeren; handmatige fotolink blijft mogelijk. */}
}
function startPhotoFetch(){
  if(photoFetchStarted)return;photoFetchStarted=true;
  const names=[...new Set(all().filter(e=>!e.image&&!officialPhotos[e.id]?.url).map(cleanArtist))];
  let index=0;async function worker(){while(index<names.length){const name=names[index++];await fetchArtistPhoto(name)}}
  Promise.all(Array.from({length:3},worker)).finally(()=>{photoFetchStarted=false});
}

function drawConcertMap(){

    el.innerHTML='<div class="notice">De kaartbibliotheek kan niet worden geladen. Controleer je internetverbinding of probeer opnieuw.</div>';
    return;
  }
  if(leafletMap){leafletMap.remove();leafletMap=null;}
  leafletMap=L.map(el,{scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bijdragers',maxZoom:18
  }).addTo(leafletMap);
  const cityMap=new Map();
  for(const e of mapEvents()){
    if(!CITY_COORDS[e.city])continue;
    if(!cityMap.has(e.city))cityMap.set(e.city,[]);
    cityMap.get(e.city).push(e);
  }
  const bounds=[];
  for(const [city,events] of cityMap){
    const pos=CITY_COORDS[city];bounds.push(pos);
    const eventRows=events.slice(0,22).map(e=>
      '<div style="padding:5px 0;border-bottom:1px solid #e7eceb"><b>'+h(e.date)+'</b> · '+

      ' concert(en)<p style="margin:4px 0;font-size:12px">Marker: plaatscentrum</p>'+eventRows+
      (events.length>22?'<p>En nog '+(events.length-22)+' concerten. Filter op periode voor een kortere lijst.</p>':'')+'</div>';
    L.circleMarker(pos,{radius:Math.min(16,6+Math.sqrt(events.length)*2),color:'#20574b',fillColor:'#83d0b7',fillOpacity:0.85,weight:2})
      .addTo(leafletMap).bindPopup(popup,{maxWidth:320});
  }
  if(bounds.length)leafletMap.fitBounds(bounds,{padding:[24,24],maxZoom:10});

  setTimeout(()=>{if(leafletMap)leafletMap.invalidateSize()},100);
}

const safeExternalUrl=v=>typeof v==='string'&&/^https:\/\//i.test(v)?v:'';
function timeInAmsterdam(iso){
 const d=new Date(iso||'');if(Number.isNaN(d.getTime()))return {};
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);
 const by=Object.fromEntries(parts.map(p=>[p.type,p.value]));
 return {date:by.year+'-'+by.month+'-'+by.day,time:by.hour+':'+by.minute};
}
function normalizeExternalEvent(item,source){
 if(!item||typeof item!=='object')return null;
 const rawVenue=source==='Gigora'?item.venue:item.venue_name||item.venue;
 const venue=typeof rawVenue==='string'?rawVenue:String(rawVenue?.name||'');
 const location=typeof item.city==='string'?item.city:(item.city?.name||item.venue?.city||'');
 const city=typeof location==='string'?location:'';
 const title=String(item.headliner||item.artist_name||item.title||item.name||'').trim();
 const when=timeInAmsterdam(source==='Gigora'?item.starts_at:item.start_utc||item.starts_at);
 const date=when.date||String(item.date||'').slice(0,10);
 if(!title||!venue||!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;
 let price=null;
 const rawPrice=source==='Gigora'?item.price_range?.min:item.price_min??item.price;
 const currency=source==='Gigora'?item.price_range?.currency:item.currency;
 if((currency==='EUR'||currency==='€')&&rawPrice!==undefined&&rawPrice!==null&&Number.isFinite(Number(rawPrice))&&Number(rawPrice)>=0)price=Number(rawPrice);
 const url=safeExternalUrl(item.ticket_url)||safeExternalUrl(item.gigora_url)||safeExternalUrl(item.url);
 return {name:title,date,time:when.time||'',venue,city,price,url,sourceUrl:url,source_name:source,review_required:true};
}

}
async function fetchLiveConcertMatches(form){

 gigora.searchParams.set('limit','40');
 if(city)gigora.searchParams.set('city',city);
 if(selectedDate){gigora.searchParams.set('from',selectedDate);gigora.searchParams.set('to',selectedDate)}

   try{
     const r=await fetch(url.toString(),{mode:'cors',cache:'no-store',signal:AbortSignal.timeout(11000)});
     if(!r.ok)throw Error('HTTP '+r.status);
     const data=await r.json();

     return {source,items};
   }catch(e){return {source,items:[],error:String(e.message||e)}}

}

function extractJsonLdEvents(node,result=[]){

 if(types.some(t=>['MusicEvent','Event','Festival','TheaterEvent'].includes(t)))result.push(node);
 if(node['@graph'])extractJsonLdEvents(node['@graph'],result);
 return result;
}

 };

 const date=/^\d{4}-\d{2}-\d{2}/.test(rawDate)?rawDate.slice(0,10):'';
 let time='';
 if(/T\d{2}:\d{2}/.test(rawDate)){
   if(/[zZ]$|[+-]\d{2}:\d{2}$/.test(rawDate)){
     const d=new Date(rawDate);
     if(!Number.isNaN(d.getTime()))time=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);
   }else time=rawDate.slice(11,16);
 }
 const loc=Array.isArray(obj.location)?obj.location[0]:obj.location;

 const city=typeof address==='string'?'':String(address?.addressLocality||'');
 const offers=Array.isArray(obj.offers)?obj.offers[0]:obj.offers;

const NL_MONTHS={jan:1,feb:2,mrt:3,mar:3,apr:4,mei:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dec:12};
const NL_DAYS={zo:0,ma:1,di:2,wo:3,do:4,vr:5,za:6};
function inferDutchEventDate(dayText,monthText,weekDay){
 const day=Number(dayText),month=NL_MONTHS[String(monthText||'').toLowerCase().replace('.','')];
 if(!month||day<1||day>31)return '';
 const currentYear=new Date().getFullYear(),now=new Date();
 const days=[];
 for(let year=currentYear;year<=currentYear+2;year++){
   const d=new Date(year,month-1,day,12);
   if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day)continue;
   if(d.getTime()<now.getTime()-86400000)continue;
   if(weekDay&&NL_DAYS[weekDay]!==d.getDay())continue;
   days.push(d);
 }
 if(!days.length)return '';
 const d=days[0];
 return d.getFullYear()+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
function parseMetropoolVisibleText(content,heading,sourceUrl){

 if(!/^https:\/\/(www\.)?metropool\.nl\/agenda\//i.test(sourceUrl))return null;
 const text=String(content||'').replace(/\u00a0/g,' ').slice(0,80000);
 const name=String(heading||'').replace(/\s+\|\s+Metropool.*$/i,'').trim();
 const short=text.match(/\b(?:(ma|di|wo|do|vr|za|zo)\s+)?(\d{1,2})\s+(jan|feb|mrt|mar|apr|mei|jun|jul|aug|sep|okt|oct|nov|dec)\b/i);

   const m=part.match(/^(.{2,65}?),\s*(Hengelo|Enschede|Almelo)\b/i);
   if(m){venue=m[1].trim();city=m[2];}

 if(!city){
   const matched=text.match(/\b(?:Hengelo|Enschede|Almelo)\b/);

 if(!venue)venue='Metropool';
 const priceMatch=text.match(/Voorverkoop\s*€\s*(\d{1,4}(?:[,.]\d{1,2})?)/i);

async function importConcertFromUrl(url){
 const parsed=new URL(url);
 if(parsed.protocol!=='https:'||!parsed.hostname||parsed.username||parsed.password||!parsed.hostname.includes('.'))throw Error('Gebruik een geldige openbare HTTPS-link.');
 if(['localhost','127.0.0.1','0.0.0.0'].includes(parsed.hostname)||parsed.hostname.endsWith('.local'))throw Error('Deze link is geen openbare concertpagina.');
 if(/(?:^|[?&])(?:token|auth|access_token|ticket_id|order_id|booking|session|secret|key)=/i.test(parsed.search))throw Error('Verwijder persoonlijke parameters of gebruik de openbare evenementpagina.');
 const canonical=parsed.origin+parsed.pathname+parsed.search;
 const known=[...all(),...discoveryEvents].filter(e=>String(e.sourceUrl||e.url||'').replace(/\/$/,'')===canonical.replace(/\/$/,''));
 if(known.length)return {candidates:known.map(e=>({...e,sourceUrl:canonical,url:canonical,source_name:'ConcertRadar',review_required:true})),metadataOnly:false};
 const api=new URL('https://api.microlink.io/');
 api.searchParams.set('url',canonical);
 api.searchParams.set('data.structured.selectorAll','script[type="application/ld+json"]');
 api.searchParams.set('data.structured.attr','text');
 api.searchParams.set('data.pageText.selector','main');
 api.searchParams.set('data.pageText.attr','text');
 api.searchParams.set('data.bodyText.selector','body');
 api.searchParams.set('data.bodyText.attr','text');
 api.searchParams.set('data.headline.selector','h1');
 api.searchParams.set('data.headline.attr','text');
 const response=await fetch(api.toString(),{mode:'cors',cache:'no-store',signal:AbortSignal.timeout(18000)});
 if(!response.ok)throw Error('Metadatadienst reageert niet (HTTP '+response.status+').');
 const body=await response.json();
 if(body.status!=='success'||!body.data)throw Error('De pagina kon niet worden uitgelezen.');
 const data=body.data;
 const nodes=parseSchemaFromMicrolink(data.structured);
 const candidates=nodes.map(node=>eventFromSchema(node,canonical)).filter(e=>e.name&&e.date);
 const pageText=String(data.pageText||data.bodyText||'');
 const headline=String(data.headline||data.title||'');
 const metropool=parseMetropoolVisibleText(pageText,headline,canonical);
 // The source text can contain extra detail absent from embedded metadata.
 if(metropool&&metropool.date){
   const same=candidates.find(x=>x.date===metropool.date);
   const combined={...(same||{}),...metropool,
      name:metropool.name||same?.name||'',
      time:metropool.time||same?.time||'',
      venue:metropool.venue||same?.venue||'',
      city:metropool.city||same?.city||'',
      price:metropool.price??same?.price??null,
      genre:metropool.genre||same?.genre||''};
   return {candidates:[combined],metadataOnly:false};
 }
 if(candidates.length)return {candidates:candidates.slice(0,8),metadataOnly:false};
 const title=String(data.headline||data.title||'').replace(/\s+[|\-–]\s+[^|\-–]+$/,'').trim();
 return {candidates:[{name:title,date:'',venue:'',city:'',price:null,sourceUrl:canonical,url:canonical,source_name:'Alleen paginatitel, niet gecontroleerd',review_required:true}],metadataOnly:true};
}

function calendarIcs(){
  const escape=x=>String(x??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const events=all().filter(e=>statusOf(e)==='booked'||statusOf(e)==='interested');
  const parts=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ConcertRadar//NL','CALSCALE:GREGORIAN','X-WR-CALNAME:ConcertRadar'];
  for(const e of events){
    const dt=e.date.replaceAll('-','');
    // DATE (all-day) avoids guessing an event's start time or timezone.
    const next=new Date(e.date+'T12:00:00Z');next.setUTCDate(next.getUTCDate()+1);
    const dtend=next.toISOString().slice(0,10).replaceAll('-','');
    parts.push('BEGIN:VEVENT','UID:'+escape(e.id)+'@concertradar.local','DTSTAMP:'+now,
      'DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+dtend,
      'SUMMARY:'+escape(e.name),'LOCATION:'+escape(e.venue+', '+e.city),
      'DESCRIPTION:'+escape((statusOf(e)==='booked'?'Kaarten gekocht':'Interessant')+(e.note?'\n'+e.note:'')+'\n'+(e.sourceUrl||e.url||'')),
      'END:VEVENT');
  }
  parts.push('END:VCALENDAR');
  return parts.join('\r\n')+'\r\n';
}
function downloadText(filename,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

 if(importButton)importButton.onclick=async()=>{
   const link=String(manualForm.elements.url.value||'').trim();
   if(!link){box.innerHTML='<p class="notice">Plak eerst een link naar de openbare concertpagina.</p>';return;}
   importButton.disabled=true;importButton.textContent='Concertpagina lezen...';
   box.innerHTML='<p class="notice">Concertpagina wordt uitgelezen via een externe metadatadienst.</p>';
   try{
     const result=await importConcertFromUrl(link);
     if(!document.contains(manualForm))return;
     if(!result.candidates.length)throw Error('Geen concertgegevens gevonden.');
     box.innerHTML='<p class="muted">'+(result.metadataOnly?'Alleen de paginatitel is gevonden. Vul datum en zaal zelf in.':'Gevonden concertgegevens. Kies het juiste evenement om deze over te nemen.')+'</p>'+
       result.candidates.map((e,i)=>'<div class="lookup-row"><div><b>'+h(e.name||'Onbekend concert')+'</b>'+
       '<div class="muted">'+h(e.date||'Datum onbekend')+' · '+h(e.venue||'Podium onbekend')+' · '+h(e.city||'Plaats onbekend')+
       (e.price!=null?' · '+euro(e.price):'')+'</div><span class="tag">'+h(e.source_name)+'</span></div>'+
       '<button type="button" class="btn" data-import-choice="'+i+'">Overnemen</button></div>').join('');
     box.querySelectorAll('[data-import-choice]').forEach(btn=>btn.onclick=()=>fillFromLinkedConcert(manualForm,result.candidates[Number(btn.dataset.importChoice)]));
   }catch(e){
     if(document.contains(manualForm))box.innerHTML='<p class="notice">Automatisch uitlezen niet gelukt: '+h(e.message)+'. Je kunt de link bewaren en de overige velden zelf invullen.</p>';
   }finally{if(document.contains(manualForm)){importButton.disabled=false;importButton.textContent='Haal gegevens op uit link';}}
 };
}

if(manualForm){
 const matches=document.getElementById('matchResults');
 const find=document.getElementById('findExisting');
 if(find)find.onclick=async ()=>{
   const artist=String(manualForm.elements.name.value||'').trim();
   if(artist.length<3){matches.innerHTML='<p class="notice">Vul eerst minimaal drie letters van de artiestnaam in.</p>';return}
   find.disabled=true;find.textContent='Zoeken...';
   matches.innerHTML='<p class="notice">Zoekt in de masterlijst en openbare concertagenda’s...</p>';
   const local=lookupConcerts(manualForm).map(e=>({...e,source_name:e.review_required?'ConcertRadar (onbevestigd)':'ConcertRadar'}));
   let external={items:[],failed:[]};
   try{external=await fetchLiveConcertMatches(manualForm)}catch(e){external.failed=['Externe zoekdiensten']}
   // Form may have been replaced during the async search.
   if(!document.contains(manualForm))return;
   find.disabled=false;find.textContent='Zoek concert automatisch';
   const found=distinctMatches([...local,...external.items]);
   if(!found.length){
     matches.innerHTML='<p class="notice">Geen passende concerten gevonden. De zoekdiensten zijn niet volledig. Controleer het optreden via Zoek via Google of vul de gegevens zelf in.</p>';
     return;
   }
   matches.innerHTML='<p class="muted">'+found.length+' mogelijke overeenkomsten. Klik op <b>Overnemen</b> om de velden te vullen. Externe resultaten zijn nog niet onafhankelijk gecontroleerd.</p>'+
     (external.failed.length?'<p class="muted">Niet bereikbaar: '+h(external.failed.join(', '))+'. De overige resultaten blijven bruikbaar.</p>':'')+
     found.map((e,i)=>'<div class="lookup-row"><div><b>'+h(e.name)+'</b><div class="muted">'+h(e.date)+(e.time?' · '+h(e.time):'')+' · '+h(e.venue||e.source_venue)+' · '+h(e.city||'')+'</div>'+
       '<span class="tag">'+h(e.source_name||'ConcertRadar')+'</span> '+
       (e.review_required?'<span class="tag">Controle vereist</span>':'')+
       (e.price!=null?'<span class="tag">'+euro(e.price)+'</span>':'')+
       (safeExternalUrl(e.url)?'<a href="'+h(e.url)+'" target="_blank" rel="noopener noreferrer">Bron bekijken</a>':'')+
       '</div><button class="btn" type="button" data-use-match="'+i+'">Overnemen</button></div>').join('');
   matches.querySelectorAll('[data-use-match]').forEach(x=>x.onclick=()=>fillKnownConcert(manualForm,found[Number(x.dataset.useMatch)]));
 };
 const search=document.getElementById('searchOfficial');
 if(search)search.onclick=()=>{
    const name=String(manualForm.elements.name.value||'').trim();
    if(name.length<3){alert('Vul eerst de naam van de artiest in.');return;}
    const query=[name,manualForm.elements.date.value,manualForm.elements.city.value,'concert officiële tickets'].filter(Boolean).join(' ');
    window.open('https://www.google.com/search?q='+encodeURIComponent(query),'_blank','noopener,noreferrer');
 };
}

if(manualForm)manualForm.onsubmit=e=>{
 e.preventDefault();
 const d=Object.fromEntries(new FormData(manualForm));
 const name=String(d.name||'').trim(),venue=String(d.venue||'').trim(),city=String(d.city||'').trim(),day=String(d.date||'');
 if(!name||!venue||!city||!/^\d{4}-\d{2}-\d{2}$/.test(day)){alert('Vul artiest, datum, podium en plaats in.');return;}
 const url=String(d.url||'').trim();
 if(url&&!/^https:\/\/[^/]+/i.test(url)){alert('Gebruik een HTTPS-link of laat het veld leeg.');return;}
 const old=extra.find(x=>x.id===state.editingId);
 const duplicate=extra.some(x=>x.id!==old?.id&&x.date===day&&x.name.toLowerCase()===name.toLowerCase()&&x.city.toLowerCase()===city.toLowerCase());
 if(duplicate){alert('Dit concert staat al bij je eigen concerten. Gebruik Wijzigen.');return;}
 const id=old?.id||'handmatig-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
 const event={...(old||{}),id,personal:true,name,date:day,time:String(d.time||''),venue,city,
 genre:String(d.genre||'').trim()||'Onbekend',price:d.price!==''?Number(d.price):null,quality:old?.quality??7,value:old?.value??null,
 priority:'EIGEN CONCERT',match:old?.match||'',note:String(d.note||'').trim(),reason:String(d.note||'').trim()||'Zelf toegevoegd concert.',
 sourceUrl:url,url:url||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(venue+' '+city),
 scope:CITY_COORDS[city]?'regionaal':'landelijk'};
 extra=old?extra.map(x=>x.id===id?event:x):[...extra,event];
 flags[id]??={};flags[id].status=String(d.status||'');flags[id].favorite=d.status==='interested';flags[id].booked=d.status==='booked';
 persist();state.editingId='';state.tab='add';render();
 alert('Concert opgeslagen in deze browser. Maak een back-up via Updates & beheer om het over te zetten.');
};
const cancelEdit=document.getElementById('cancelEdit');
if(cancelEdit)cancelEdit.onclick=()=>{state.editingId='';render()};
document.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=()=>{state.editingId=btn.dataset.edit;state.tab='add';render();document.getElementById('personalForm')?.scrollIntoView({behavior:'smooth',block:'start'})});
document.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=()=>{
 const id=btn.dataset.delete;const concert=extra.find(x=>x.id===id);
 if(!concert||!confirm('Concert "'+concert.name+'" verwijderen?'))return;
 extra=extra.filter(x=>x.id!==id);delete flags[id];if(state.editingId===id)state.editingId='';persist();render();
});
const monthBack=document.getElementById('monthBack');if(monthBack)monthBack.onclick=()=>shiftMonth(-1);
const monthNext=document.getElementById('monthNext');if(monthNext)monthNext.onclick=()=>shiftMonth(1);
const exportCalendar=document.getElementById('exportCalendar');
if(exportCalendar)exportCalendar.onclick=()=>downloadText('ConcertRadar-mijn-agenda.ics',calendarIcs(),'text/calendar;charset=utf-8');}
render();startPhotoFetch();loadPublishedData();if("serviceWorker" in navigator && location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));}
</script></body></html>
