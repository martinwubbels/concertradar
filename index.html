/* Concert cards v3: information first, all secondary actions behind Details. */
.event.event-card-v3{
 display:grid;grid-template-columns:66px 76px minmax(0,1fr) 118px;
 grid-template-rows:auto auto;align-items:center;column-gap:13px;row-gap:8px;
 padding:13px 15px;min-width:0;
}
.event-card-v3 .datebox{grid-column:1;grid-row:1;padding:8px 3px;align-self:center}
.event-card-v3 .datebox strong{font-size:23px}
.event-card-v3 .datebox span{font-size:10px;line-height:1.4}
.event-card-v3 .artistpic,.event-card-v3.compact-event .artistpic{
 grid-column:2;grid-row:1;display:flex;flex:none;width:76px;height:76px;border-radius:10px;
}
.event-card-v3 .fallback[hidden]{display:none}
.event-card-v3 .eventcopy{grid-column:3;grid-row:1;min-width:0;align-self:center}
.event-card-v3 .eventcopy h3{font-size:clamp(16px,1.5vw,19px);line-height:1.2;margin:0 0 4px;overflow-wrap:anywhere}
.event-card-v3.compact-event .eventcopy h3{font-size:clamp(16px,1.5vw,19px)}
.event-card-v3 .status-strip{font-size:10px;padding:3px 7px;margin:0 0 5px}
.event-card-v3 .card-location{font-size:13px;color:#becbd4;margin:0;line-height:1.4}
.event-card-v3 .card-summary-tags{display:flex;flex-wrap:wrap;gap:5px 10px;color:#b4c7cf;font-size:11px;margin-top:6px}
.event-card-v3 .card-warning{color:#ffce93;font-weight:700}
.event-card-v3 .card-score{grid-column:4;grid-row:1;display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;align-self:center;min-width:0}
.event-card-v3 .card-score>span:first-child{color:#a9bec7;font-size:11px}
.event-card-v3 .card-score strong{color:#b8ead8;font-size:29px;line-height:1.1;font-variant-numeric:tabular-nums}
.event-card-v3 .card-score small{font-size:12px;font-weight:500;color:#a9c2bc}
.event-card-v3 .score-provenance{font-size:10px;line-height:1.25;color:#a7b9c6;max-width:110px}
.event-card-v3 .card-bottom{grid-column:1/-1;grid-row:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;min-width:0;border-top:1px solid #ffffff15;padding-top:9px}
.event-card-v3 .card-primary-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.event-card-v3 .card-primary-actions button,.event-card-v3 .card-secondary-actions button{
 background:#223343;border:1px solid #496071;color:#e8f1f5;
 border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;line-height:1.25;
}
.event-card-v3 .card-primary-actions button:hover,.event-card-v3 .card-secondary-actions button:hover{border-color:#aed5d5}
.event-card-v3 .card-primary-actions button.selected[data-action="interested"]{background:#9ecff1;color:#132838;border-color:#9ecff1;font-weight:750}
.event-card-v3 .card-primary-actions button.selected[data-action="rejected"]{background:#687781;color:#fff;border-color:#82909a}
.event-card-v3 .card-primary-actions button.selected[data-action="booked"]{background:#f7c76a;color:#271903;border-color:#f7c76a;font-weight:750}
.event-card-v3 .card-primary-actions [data-action="booked"]{border-color:#b28b48;color:#ffe1a3}
.event-card-v3 .event-more{margin-left:auto;position:relative;flex:0 0 auto}
.event-card-v3 .event-more>summary{display:block;cursor:pointer;list-style:none;color:#c0eee4;font-size:13px;border:1px solid #4d726f;border-radius:8px;padding:8px 13px;font-weight:650}
.event-card-v3 .event-more>summary::-webkit-details-marker{display:none}

.event-card-v3 .score-explanation{margin:10px 0}
.event-card-v3 .artistpic img{display:block}
.event-card-v3 .artistpic img[style*="display: none"]{display:none}
.event-card-v3 .event-more[open]{flex:1 0 100%;width:100%;margin-left:0}
.event-card-v3 .event-more[open]>summary{width:max-content;margin-left:auto}
@media(max-width:780px){
 .event.event-card-v3{grid-template-columns:54px 60px minmax(0,1fr);column-gap:9px;padding:12px;row-gap:9px}
 .event-card-v3 .datebox strong{font-size:20px}
 .event-card-v3 .artistpic,.event-card-v3.compact-event .artistpic{width:60px;height:60px}
 .event-card-v3 .eventcopy h3,.event-card-v3.compact-event .eventcopy h3{font-size:16px}
 .event-card-v3 .card-score{grid-column:1/-1;grid-row:2;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:9px;text-align:left}
 .event-card-v3 .card-score strong{font-size:19px}
 .event-card-v3 .score-provenance{max-width:none}
 .event-card-v3 .card-bottom{grid-row:3}
 .event-card-v3 .card-primary-actions{gap:5px}
 .event-card-v3 .card-primary-actions button{padding:9px 8px;font-size:12px}
}
@media(max-width:390px){

 .event-card-v3 .card-primary-actions{width:100%}
 .event-card-v3 .card-primary-actions button{flex:1 1 auto}
 .event-card-v3 .event-more{margin-left:0}
}

async function fetchArtistPhoto(name){

  const api='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('intitle:"'+name+'" musician band')+'&gsrlimit=4&prop=pageimages|info&pithumbsize=500&inprop=url&format=json&origin=*';
  try{
    const res=await fetch(api,{mode:'cors'});if(!res.ok)throw Error('HTTP '+res.status);
    const json=await res.json();const pages=Object.values(json.query?.pages||{});
    const norm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');
    const exact=pages.find(p=>norm(p.title)===norm(name));
    const page=exact||pages.find(p=>norm(p.title).startsWith(norm(name))&&/band|musician|singer|rapper|group|artist/i.test(p.title));

       .filter(([key])=>Number.isFinite(Number(review?.[key]))&&Number(review[key])>=1&&Number(review[key])<=10);
   const sum=dimensions.reduce((n,[,w])=>n+w,0);

function preloadKnownTaste(){
 if(Number(appSettings.tasteSeedVersion)>=1)return false;
 const words=Array.isArray(appSettings.tasteWords)?appSettings.tasteWords.filter(x=>x&&typeof x.term==='string'):[]; 
 const keys=new Set(words.map(w=>w.kind+'|'+tasteNorm(w.term)));
 const added=KNOWN_TASTE_V1.filter(w=>!keys.has(w.kind+'|'+tasteNorm(w.term)));
 appSettings.tasteWords=[...words,...added].slice(0,60);
 appSettings.tasteSeedVersion=1;
 if(added.length)appSettings.tasteWordsUpdatedAt=new Date().toISOString();
 persist();
 return added.length>0;

function tasteWords(){return Array.isArray(appSettings.tasteWords)?appSettings.tasteWords.filter(w=>w&&typeof w.term==='string'&&['genre','artiest','kenmerk'].includes(w.kind)&&[-2,-1,1,2].includes(Number(w.weight))):[]}
function saveTasteWord(term,kind,weight){
 term=String(term||'').replace(/[<>]/g,'').trim().replace(/\s+/g,' ').slice(0,55);
 const key=tasteNorm(term);weight=Number(weight);
 if(key.length<2||!['genre','artiest','kenmerk'].includes(kind)||![-2,-1,1,2].includes(weight))return false;
 const previous=tasteWords().filter(w=>!(tasteNorm(w.term)===key&&w.kind===kind));
 if(previous.length>=60)return false;
 appSettings.tasteWords=[...previous,{term,kind,weight}].sort((a,b)=>a.kind.localeCompare(b.kind)||a.term.localeCompare(b.term,'nl'));
 appSettings.tasteWordsUpdatedAt=new Date().toISOString();

}
function removeTasteWord(term,kind){appSettings.tasteWords=tasteWords().filter(w=>!(tasteNorm(w.term)===tasteNorm(term)&&w.kind===kind));appSettings.tasteWordsUpdatedAt=new Date().toISOString();persist()}

 const needle=tasteNorm(word.term);
 if(word.kind==='genre')return tasteGenres(event).some(g=>tasteNorm(g).includes(needle)||needle.includes(tasteNorm(g))&&tasteNorm(g).length>=3);
 if(word.kind==='artiest')return tasteNorm([event.name,event.match].join(' ')).includes(needle);

/* The six taste tools use only available concert metadata and explicit user input.
   No simulated track recommendations, live ticket counts or venue capacities. */
const DNA_TRAITS=[
 ['voice','Stemgeluid',['stem','zang','vocal','rauw','karaktervolle stem','singer']],
 ['lyrics','Songteksten',['tekst','verhaal','poët','lyric','liedjes','songwriter']],
 ['authenticity','Eigenheid',['eigenzinnig','authentiek','original','persoonlijk','ongepolijst']],
 ['instruments','Instrumentatie',['gitaar','akoestisch','bluegrass','banjo','instrument','blazers']],
 ['live','Live-uitstraling',['live','energie','intens','podium','show','band']]
];
const DNA_DEFAULT={voice:5,lyrics:5,authenticity:3,instruments:3,live:3};
const REJECT_REASONS=[
 ['music','Muziek past niet bij mij'],
 ['distance','Te ver reizen'],
 ['price','Te duur'],
 ['date','Datum komt niet uit'],
 ['seen','Al gezien'],
 ['other','Anders']
];
function dnaSettings(){const x=appSettings.musicDNA||{};return Object.fromEntries(DNA_TRAITS.map(([key])=>[key,Math.max(0,Math.min(5,Number.isFinite(Number(x[key]))?Number(x[key]):DNA_DEFAULT[key]))]))}
function dnaScore(e){
 const words=tasteNorm([e.genre,e.reason,e.match].filter(Boolean).join(' '));
 const dna=dnaSettings();
 let boost=0,hit=[];
 for(const [key,label,tokens] of DNA_TRAITS){
   if(tokens.some(w=>words.includes(tasteNorm(w)))){boost+=(dna[key]-2.5)*.12;hit.push(label)}
 }
 return {boost:Math.min(1.15,Math.max(-1.15,boost)),hit};
}
function listeningVerdict(e){return appSettings.listening?.[e.id]||null}
function saveListening(e,verdict){
 if(!['love','maybe','dislike'].includes(verdict))return;
 appSettings.listening??={};

}
function listeningBoost(e){

function rejectionPenalty(e){return flags[e.id]?.rejectionReason==='music'?-0.85:0}
function surpriseEvidence(e){
 const explicit=tasteManualEffect(e).matched.filter(x=>Number(x.weight)>0);
 const dna=dnaScore(e).hit;
 const knownSimilarity=String(e.match||'').trim();
 const specificGenre=tasteGenres(e).filter(g=>g&& !/nog niet ingedeeld|onbekend|^muziek$/i.test(g));
 const learned=tasteProfile().genres.filter(x=>x.score>.3&&specificGenre.some(g=>tasteNorm(g)===tasteNorm(x.genre)));
 // The personal score alone is not enough evidence to call something a discovery.
 const indicators=[...explicit.map(x=>x.term),...dna,...(learned.length?['eerder gewaardeerd genre']:[]),...(knownSimilarity?['vergelijkbare artiesten']:[])];
 return [...new Set(indicators)].slice(0,3);

   (isBooked(x)||statusOf(x)==='interested'||statusOf(x)==='rejected'||Boolean(assessments[x.id])||Boolean(listeningVerdict(x))));

  try{

   const res=await fetch('https://ws.audioscrobbler.com/2.0/?'+p,{signal:AbortSignal.timeout(14000)});
   if(!res.ok)throw Error('HTTP '+res.status);
   const json=await res.json();if(json.error)throw Error(json.message||'API-fout');
   const counts={};for(const x of json.topartists?.artist||[])if(x.name&&Number(x.playcount)>0)counts[x.name]=Number(x.playcount);

 });

  try{
   const counts={};

    if(file.size>20000000)throw Error('Maximaal 20 MB per bestand');
    const list=JSON.parse(await file.text());if(!Array.isArray(list))throw Error('Verwacht een Spotify JSON-array');

function tasteResult(e){
 const genres=tasteGenres(e);
 const profile=tasteProfile();
 const learned=new Map(profile.genres.map(x=>[x.genre,x]));
 const baseline=genres.reduce((sum,g)=>sum+(TASTE_BASE[g]||0),0);
 let learnedValue=0;
 const reasons=[];
 for(const g of genres){
   const x=learned.get(g);
   if(!x)continue;
   learnedValue+=Math.max(-1.25,Math.min(1.25,x.score*.48));
   if(x.score>.3)reasons.push(g);
 }
 // Similarity to known music references is used only for explicitly authored match descriptions.
 const likedArtists=[...tasteSignals()].filter(x=>x.signal>.8).map(x=>String(x.e.name||'').toLowerCase());
 const comparable=String(e.match||'').toLowerCase();
 const artistSimilarity=likedArtists.some(x=>x.length>5&&comparable.includes(x))?.35:0;
 learnedValue+=artistSimilarity;
 const editorial=e.quality!=null&&Number.isFinite(Number(e.quality))?Number(e.quality):7;
 const manual=tasteManualEffect(e);
 const dna=dnaScore(e);
 const musicFeedback=listeningBoost(e)+rejectionPenalty(e);
 const editorialEffect=(editorial-7.5)*0.62;
 const learnedEffect=Math.max(-1.8,Math.min(2.0,learnedValue));
 const historyEffect=listeningHistoryBoost(e);
 const personal=Math.max(1,Math.min(10,6.5+editorialEffect+baseline+learnedEffect+manual.impact+dna.boost+musicFeedback+historyEffect));
 return {score:Math.round(personal*10)/10,dnaMatches:dna.hit,signals:profile.examples,reason:reasons.slice(0,3).join(', '),source:manual.matched.length?'Eigen voorkeuren + eerdere keuzes':profile.examples?'Persoonlijke inschatting':'Startprofiel',matched:manual.matched,breakdown:[['Startpunt',6.5],['Redactionele inschatting',editorialEffect],['Genrevoorkeur',baseline],['Eerdere keuzes en reviews',learnedEffect],['Woordwolk',manual.impact],['Muziek-DNA',dna.boost],['Luistertest en afwijzing',musicFeedback],['Luistergeschiedenis',historyEffect]]};
}
function scoreDetails(e){

 const values=result.breakdown||[];
 return '<details class="score-explanation"><summary>Waarom '+result.score.toFixed(1)+'/10?</summary><div class="score-parts">'+values.map(([name,num])=>'<div><span>'+h(name)+'</span><b>'+(num>=0?'+':'')+num.toFixed(2)+'</b></div>').join('')+'</div><p class="muted">De bijdragen worden bij elkaar opgeteld en begrensd op 1–10. Dit is een schatting op basis van beschikbare beschrijvingen, geen audioanalyse. Het startpunt van 6,5 is neutraal.</p></details>';
}

async function getRoadRoute(dest,element){
 if(!dest||!dest.exact){element.textContent='Reistijd niet beschikbaar: exact podiumadres onbekend.';return;}
 const origin=venueLocations.origin||{lat:52.7254,lng:6.9852};
 element.textContent='Route berekenen...';
 try{
   const url='https://router.project-osrm.org/route/v1/driving/'+
     [origin.lng,origin.lat].join(',')+';'+[dest.lng,dest.lat].join(',')+'?overview=false';
   const response=await fetch(url,{mode:'cors',signal:AbortSignal.timeout(12000)});
   if(!response.ok)throw Error('Routebron niet bereikbaar');
   const data=await response.json();
   const route=data.routes?.[0];
   if(!route||!Number.isFinite(route.duration)||!Number.isFinite(route.distance))throw Error('Geen route gevonden');
   element.textContent='Vanaf '+(origin.label||'Klazienaveen')+': circa '+Math.round(route.distance/1000)+' km en '+Math.round(route.duration/60)+' min rijden (route-inschatting, zonder verkeer).';

const safeExternalUrl=v=>typeof v==='string'&&/^https:\/\//i.test(v)?v:'';
function timeInAmsterdam(iso){
 const d=new Date(iso||'');if(Number.isNaN(d.getTime()))return {};
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);
 const by=Object.fromEntries(parts.map(p=>[p.type,p.value]));
 return {date:by.year+'-'+by.month+'-'+by.day,time:by.hour+':'+by.minute};
}
function normalizeExternalEvent(item,source){
 if(!item||typeof item!=='object')return null;
 const rawVenue=source==='Gigora'?item.venue:item.venue_name||item.venue;
 const venue=typeof rawVenue==='string'?rawVenue:String(rawVenue?.name||'');
 const location=typeof item.city==='string'?item.city:(item.city?.name||item.venue?.city||'');
 const city=typeof location==='string'?location:'';
 const title=String(item.headliner||item.artist_name||item.title||item.name||'').trim();
 const when=timeInAmsterdam(source==='Gigora'?item.starts_at:item.start_utc||item.starts_at);
 const date=when.date||String(item.date||'').slice(0,10);
 if(!title||!venue||!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;
 let price=null;
 const rawPrice=source==='Gigora'?item.price_range?.min:item.price_min??item.price;
 const currency=source==='Gigora'?item.price_range?.currency:item.currency;
 if((currency==='EUR'||currency==='€')&&rawPrice!==undefined&&rawPrice!==null&&Number.isFinite(Number(rawPrice))&&Number(rawPrice)>=0)price=Number(rawPrice);
 const url=safeExternalUrl(item.ticket_url)||safeExternalUrl(item.gigora_url)||safeExternalUrl(item.url);

}
function matchesArtist(input,event){

}

 if(city)gigora.searchParams.set('city',city);

}

function extractJsonLdEvents(node,result=[]){
 if(Array.isArray(node)){node.forEach(x=>extractJsonLdEvents(x,result));return result;}
 if(!node||typeof node!=='object')return result;
 const types=(Array.isArray(node['@type'])?node['@type']:[node['@type']]).map(x=>String(x||'').split('/').pop());
 if(types.some(t=>['MusicEvent','Event','Festival','TheaterEvent'].includes(t)))result.push(node);
 if(node['@graph'])extractJsonLdEvents(node['@graph'],result);
 return result;
}
function parseSchemaFromMicrolink(value){
 const raw=Array.isArray(value)?value:[value];
 const result=[];
 for(const item of raw){
   if(typeof item==='string'){
     try{extractJsonLdEvents(JSON.parse(item),result)}catch(e){}
   }else if(item&&typeof item==='object')extractJsonLdEvents(item,result);
 }
 return result;
}
function eventFromSchema(obj,sourceUrl){
 const info=x=>{
   if(!x)return '';
   if(typeof x==='string')return x;
   if(Array.isArray(x))return info(x[0]);
   if(typeof x==='object')return String(x.name||'');
   return '';
 };
 const name=info(obj.name)||info(obj.performer);
 const rawDate=String(obj.startDate||'');
 const date=/^\d{4}-\d{2}-\d{2}/.test(rawDate)?rawDate.slice(0,10):'';
 let time='';
 if(/T\d{2}:\d{2}/.test(rawDate)){
   if(/[zZ]$|[+-]\d{2}:\d{2}$/.test(rawDate)){
     const d=new Date(rawDate);
     if(!Number.isNaN(d.getTime()))time=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);
   }else time=rawDate.slice(11,16);
 }
 const loc=Array.isArray(obj.location)?obj.location[0]:obj.location;
 const venue=info(loc);
 const address=loc&&typeof loc==='object'?loc.address:null;
 const city=typeof address==='string'?'':String(address?.addressLocality||'');
 const offers=Array.isArray(obj.offers)?obj.offers[0]:obj.offers;
 let price=null;
 const currency=offers?.priceCurrency;
 const candidate=offers?.price??offers?.lowPrice;
 if((currency==='EUR'||currency==='€')&&Number.isFinite(Number(candidate))&&candidate!==''&&candidate!=null&&Number(candidate)>=0)price=Number(candidate);
 return {name,date,time,venue,city,price,sourceUrl,url:sourceUrl,source_name:'Officiële pagina (schema.org)',review_required:true};
}

const NL_MONTHS={jan:1,feb:2,mrt:3,mar:3,apr:4,mei:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dec:12};
const NL_DAYS={zo:0,ma:1,di:2,wo:3,do:4,vr:5,za:6};
function inferDutchEventDate(dayText,monthText,weekDay){
 const day=Number(dayText),month=NL_MONTHS[String(monthText||'').toLowerCase().replace('.','')];
 if(!month||day<1||day>31)return '';
 const currentYear=new Date().getFullYear(),now=new Date();
 const days=[];
 for(let year=currentYear;year<=currentYear+2;year++){
   const d=new Date(year,month-1,day,12);
   if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day)continue;
   if(d.getTime()<now.getTime()-86400000)continue;
   if(weekDay&&NL_DAYS[weekDay]!==d.getDay())continue;
   days.push(d);
 }
 if(!days.length)return '';
 const d=days[0];
 return d.getFullYear()+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
function parseMetropoolVisibleText(content,heading,sourceUrl){
 // Content is public text from the specific official concert page.
 if(!/^https:\/\/(www\.)?metropool\.nl\/agenda\//i.test(sourceUrl))return null;
 const text=String(content||'').replace(/\u00a0/g,' ').slice(0,80000);
 const name=String(heading||'').replace(/\s+\|\s+Metropool.*$/i,'').trim();
 const short=text.match(/\b(?:(ma|di|wo|do|vr|za|zo)\s+)?(\d{1,2})\s+(jan|feb|mrt|mar|apr|mei|jun|jul|aug|sep|okt|oct|nov|dec)\b/i);
 const longDate=text.match(/\b(\d{1,2})\s+(januari|februari|maart|april|mei|juni|juli|augustus|september|oktober|november|december)\s+(20\d{2})\b/i);
 const longMonths={januari:1,februari:2,maart:3,april:4,mei:5,juni:6,juli:7,augustus:8,september:9,oktober:10,november:11,december:12};
 let date='',inferred=false;
 if(longDate){
   const n=longMonths[longDate[2].toLowerCase()];
   date=longDate[3]+'-'+String(n).padStart(2,'0')+'-'+String(Number(longDate[1])).padStart(2,'0');
 }else if(short){
   date=inferDutchEventDate(short[2],short[3],short[1]?.toLowerCase());
   inferred=Boolean(date);
 }
 // Prefer the main act over door opening / support schedule.
 const timeMatch=text.match(/Aanvang\s+hoofdact\s*(\d{1,2}:\d{2})/i)
   ||text.match(/Aanvang\s+(?!voorprogramma)(\d{1,2}:\d{2})/i);
 const location=text.match(/Locatie[ \t]+([^\n\r]{2,110})/i);
 let venue='',city='';
 if(location){
   let part=location[1].split(/\b(?:Genre|Tijdschema|Bekijk menukaart|Rijd samen|Tickets|Prijs)\b/i)[0].trim();
   part=part.replace(/\s+(?:Tickets|Prijs|Voorverkoop).*$/i,'');
   const m=part.match(/^(.{2,65}?),\s*(Hengelo|Enschede|Almelo)\b/i);
   if(m){venue=m[1].trim();city=m[2];}
 } 
 if(!city){
   const matched=text.match(/\b(?:Hengelo|Enschede|Almelo)\b/);
   if(matched)city=matched[0];
 }
 if(!venue)venue='Metropool';
 const priceMatch=text.match(/Voorverkoop\s*€\s*(\d{1,4}(?:[,.]\d{1,2})?)/i);
 const price=priceMatch?Number(priceMatch[1].replace(',','.')):null;
 const genreMatch=text.match(/Genre[ \t]+([^\n\r]{3,60})/i);
 const genre=genreMatch?genreMatch[1].split(/\b(?:Bekijk menukaart|Tijdschema|Locatie|Tickets)\b/i)[0].trim():'';
 if(!name&&!date)return null;
 return {name,date,time:timeMatch?.[1]||'',venue,city,price:Number.isFinite(price)?price:null,
   genre,sourceUrl,url:sourceUrl,source_name:'Metropool (concertpagina)',review_required:true,
   date_inferred:inferred};
}

async function importConcertFromUrl(url){
 const parsed=new URL(url);
 if(parsed.protocol!=='https:'||!parsed.hostname||parsed.username||parsed.password||!parsed.hostname.includes('.'))throw Error('Gebruik een geldige openbare HTTPS-link.');
 if(['localhost','127.0.0.1','0.0.0.0'].includes(parsed.hostname)||parsed.hostname.endsWith('.local'))throw Error('Deze link is geen openbare concertpagina.');
 if(/(?:^|[?&])(?:token|auth|access_token|ticket_id|order_id|booking|session|secret|key)=/i.test(parsed.search))throw Error('Verwijder persoonlijke parameters of gebruik de openbare evenementpagina.');
 const canonical=parsed.origin+parsed.pathname+parsed.search;
 // Published cache: verified public event information, not the user's bookings.
 try{
   const cached=await fetch('./data/link-imports.json',{cache:'no-store',signal:AbortSignal.timeout(6500)});
   if(cached.ok){
     const data=await cached.json();
     const event=Array.isArray(data.events)?data.events.find(e=>e.sourceUrl===canonical):null;
     if(event)return {candidates:[event],metadataOnly:false};
   }
 }catch(e){/* A missing cache must not block live extraction. */}

 const known=[...all(),...discoveryEvents].filter(e=>String(e.sourceUrl||e.url||'').replace(/\/$/,'')===canonical.replace(/\/$/,''));
 if(known.length)return {candidates:known.map(e=>({...e,sourceUrl:canonical,url:canonical,source_name:'ConcertRadar',review_required:true})),metadataOnly:false};
 const api=new URL('https://api.microlink.io/');
 api.searchParams.set('url',canonical);
 api.searchParams.set('data.structured.selectorAll','script[type="application/ld+json"]');
 api.searchParams.set('data.structured.attr','text');
 api.searchParams.set('data.pageText.selector','main');
 api.searchParams.set('data.pageText.attr','text');
 api.searchParams.set('data.bodyText.selector','body');
 api.searchParams.set('data.bodyText.attr','text');
 api.searchParams.set('data.headline.selector','h1');
 api.searchParams.set('data.headline.attr','text');
 const response=await fetch(api.toString(),{mode:'cors',cache:'no-store',signal:AbortSignal.timeout(18000)});
 if(!response.ok)throw Error('Metadatadienst reageert niet (HTTP '+response.status+').');
 const body=await response.json();
 if(body.status!=='success'||!body.data)throw Error('De pagina kon niet worden uitgelezen.');
 const data=body.data;
 const nodes=parseSchemaFromMicrolink(data.structured);
 const candidates=nodes.map(node=>eventFromSchema(node,canonical)).filter(e=>e.name&&e.date);
 const pageText=String(data.pageText||data.bodyText||'');
 const headline=String(data.headline||data.title||'');
 const metropool=parseMetropoolVisibleText(pageText,headline,canonical);
 // The source text can contain extra detail absent from embedded metadata.
 if(metropool&&metropool.date){
   const same=candidates.find(x=>x.date===metropool.date);
   const combined={...(same||{}),...metropool,
      name:metropool.name||same?.name||'',
      time:metropool.time||same?.time||'',
      venue:metropool.venue||same?.venue||'',
      city:metropool.city||same?.city||'',
      price:metropool.price??same?.price??null,
      genre:metropool.genre||same?.genre||''};
   return {candidates:[combined],metadataOnly:false};
 }
 if(candidates.length)return {candidates:candidates.slice(0,8),metadataOnly:false};
 const title=String(data.headline||data.title||'').replace(/\s+[|\-–]\s+[^|\-–]+$/,'').trim();
 return {candidates:[{name:title,date:'',venue:'',city:'',price:null,sourceUrl:canonical,url:canonical,source_name:'Alleen paginatitel, niet gecontroleerd',review_required:true}],metadataOnly:true};
}

 return date.toISOString().slice(0,10);
}

function calendarIcs(){
  const escape=x=>String(x??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const events=all().filter(e=>statusOf(e)==='booked'||statusOf(e)==='interested');
  const parts=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ConcertRadar//NL','CALSCALE:GREGORIAN','X-WR-CALNAME:ConcertRadar'];
  for(const e of events){
    const dt=e.date.replaceAll('-','');
    // DATE (all-day) avoids guessing an event's start time or timezone.
    const next=new Date(e.date+'T12:00:00Z');next.setUTCDate(next.getUTCDate()+1);
    const dtend=next.toISOString().slice(0,10).replaceAll('-','');
    parts.push('BEGIN:VEVENT','UID:'+escape(e.id)+'@concertradar.local','DTSTAMP:'+now,
      'DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+dtend,
      'SUMMARY:'+escape(e.name),'LOCATION:'+escape(e.venue+', '+e.city),
      'DESCRIPTION:'+escape((statusOf(e)==='booked'?'Kaarten gekocht':'Interessant')+(e.note?'\n'+e.note:'')+'\n'+(e.sourceUrl||e.url||'')),
      'END:VEVENT');
  }
  parts.push('END:VCALENDAR');
  return parts.join('\r\n')+'\r\n';
}
function downloadText(filename,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function distanceKm(e){
 const p=venuePoint(e);
 const origin=venueLocations.origin;
 if(!p||!origin||![p.lat,p.lng,origin.lat,origin.lng].every(Number.isFinite))return null;
 const rad=x=>x*Math.PI/180;
 const a=Math.sin(rad(p.lat-origin.lat)/2)**2+Math.cos(rad(origin.lat))*Math.cos(rad(p.lat))*Math.sin(rad(p.lng-origin.lng)/2)**2;
 return Math.round(6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(Math.max(0,1-a))));
}

function parseCalendarDates(text){
 // Only DTSTART dates, no titles or descriptions. Handles folded lines and both
 // all-day and timed VEVENT starts. Calendar remains locally stored as dates.
 const unfolded=String(text||'').replace(/\r?\n[ \t]/g,'');
 const events=unfolded.split(/BEGIN:VEVENT/i).slice(1);
 const dates=[];
 for(const event of events.slice(0,1500)){
   const m=event.match(/^DTSTART(?:;[^:\r\n]*)?:(\d{4})(\d{2})(\d{2})/im);
   if(m){const d=normalizeDate(m[1]+'-'+m[2]+'-'+m[3]);if(d)dates.push(d)}
 }
 return [...new Set(dates)];
}

let cloudPushTimer=null,cloudPulling=false,cloudPushing=false;

function cloudSnapshot(){return {flags,extra,assessments,settings:appSettings};}
function mergeCloudEntries(local,remote){
 const out={...(remote||{})};
 for(const [id,value] of Object.entries(local||{})){
   const prior=out[id];
   const left=Date.parse(value?.updated_at||'')||0,right=Date.parse(prior?.updated_at||'')||0;
   if(!prior||left>=right)out[id]=value;
 }
 return out;
}
function mergeCloudEvents(local,remote){
 const out=new Map((Array.isArray(remote)?remote:[]).filter(x=>x?.id).map(x=>[x.id,x]));
 for(const value of Array.isArray(local)?local:[]){
   if(!value?.id)continue;
   const prior=out.get(value.id);
   if(!prior||(Date.parse(value.updated_at||'')||0)>=(Date.parse(prior.updated_at||'')||0))out.set(value.id,value);
 }
 return [...out.values()];
}
async function cloudConnect(){
 if(cloudClient)return true;
 try{
   const resp=await fetch('./data/cloud-config.json',{cache:'no-store'});
   if(!resp.ok)throw Error('Configuratie niet bereikbaar');
   const config=await resp.json();
   if(!config.enabled||!config.url||!config.anonKey){
     cloudStatus='Nog niet geactiveerd. Volg de installatiehandleiding voor een eigen privédatabase.';
     return false;
   }
   const origin=new URL(config.url);
   if(origin.protocol!=='https:'||!origin.hostname.endsWith('.supabase.co'))throw Error('Ongeldig databaseadres');
   const lib=await import('https://esm.sh/@supabase/supabase-js@2');
   cloudClient=lib.createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   const {data,error}=await cloudClient.auth.getSession();
   if(error)throw error;
   cloudUser=data.session?.user||null;
   cloudStatus=cloudUser?'Aangemeld. Cloudgegevens worden gecontroleerd.':'Database gereed. Meld je aan via e-mail.';
   cloudClient.auth.onAuthStateChange((event,session)=>{
      const before=cloudUser?.id;
      cloudUser=session?.user||null;
      if(cloudUser&&!cloudReady&&before!==cloudUser.id)setTimeout(()=>cloudPull(),0);
      if(!cloudUser){cloudReady=false;cloudStatus='Afgemeld';if(state.tab==='sync')render();}
   });
   if(cloudUser)await cloudPull();
   return true;
 }catch(e){cloudStatus='Cloud niet bereikbaar: '+String(e.message||e);cloudClient=null;return false}
}
async function cloudPull(){
 if(!cloudClient||!cloudUser||cloudPulling||cloudPushing)return;
 cloudPulling=true;
 try{
   const {data,error}=await cloudClient.from('concertradar_user_state').select('payload').eq('user_id',cloudUser.id).maybeSingle();
   if(error)throw error;
   if(data?.payload){
     cloudReady=false;
     flags=mergeCloudEntries(flags,data.payload.flags);
     assessments=mergeCloudEntries(assessments,data.payload.assessments);
     extra=mergeCloudEvents(extra,data.payload.extra);
     const remoteSettings=data.payload.settings||{};
     const localTimestamp=Date.parse(appSettings.tasteWordsUpdatedAt||'')||0;
     const remoteTimestamp=Date.parse(remoteSettings.tasteWordsUpdatedAt||'')||0;
     const preferRemoteTaste=remoteTimestamp>localTimestamp;
     const preferRemoteDNA=(Date.parse(remoteSettings.musicDNAUpdatedAt||'')||0)>(Date.parse(appSettings.musicDNAUpdatedAt||'')||0);
     const preferRemoteListen=(Date.parse(remoteSettings.listeningUpdatedAt||'')||0)>(Date.parse(appSettings.listeningUpdatedAt||'')||0);
     const preferRemoteTravel=(Date.parse(remoteSettings.travelUpdatedAt||'')||0)>(Date.parse(appSettings.travelUpdatedAt||'')||0);
     const preferRemoteNotices=(Date.parse(remoteSettings.smartNotices?.updated_at||'')||0)>(Date.parse(appSettings.smartNotices?.updated_at||'')||0);
     const remoteHistory=(Date.parse(remoteSettings.listeningHistoryUpdatedAt||'')||0)>(Date.parse(appSettings.listeningHistoryUpdatedAt||'')||0);
     appSettings={...remoteSettings,...appSettings,
       listeningHistory:remoteHistory?remoteSettings.listeningHistory:appSettings.listeningHistory,
       listeningHistoryUpdatedAt:remoteHistory?remoteSettings.listeningHistoryUpdatedAt:appSettings.listeningHistoryUpdatedAt,
       travelLimits:preferRemoteTravel?remoteSettings.travelLimits:appSettings.travelLimits,
       travelUpdatedAt:preferRemoteTravel?remoteSettings.travelUpdatedAt:appSettings.travelUpdatedAt,
       smartNotices:preferRemoteNotices?remoteSettings.smartNotices:appSettings.smartNotices,
       tasteWords:preferRemoteTaste?remoteSettings.tasteWords:appSettings.tasteWords,
       tasteWordsUpdatedAt:preferRemoteTaste?remoteSettings.tasteWordsUpdatedAt:appSettings.tasteWordsUpdatedAt,
       musicDNA:preferRemoteDNA?remoteSettings.musicDNA:appSettings.musicDNA,
       musicDNAUpdatedAt:preferRemoteDNA?remoteSettings.musicDNAUpdatedAt:appSettings.musicDNAUpdatedAt,
       listening:preferRemoteListen?remoteSettings.listening:appSettings.listening,
       listeningUpdatedAt:preferRemoteListen?remoteSettings.listeningUpdatedAt:appSettings.listeningUpdatedAt};
     persist();
   }
   cloudReady=true;
   cloudStatus='Verbonden en bijgewerkt om '+new Date().toLocaleTimeString('nl-NL');
   await cloudPush();
   if(state.tab==='sync'||state.tab==='dashboard'||state.tab==='booked'||state.tab==='history'||state.tab==='calendar'||state.tab==='taste'||state.tab==='surprise'||state.tab==='urgency'||state.tab==='trends')render();
 }catch(e){cloudStatus='Cloudophalen mislukt, lokaal bewaard: '+String(e.message||e)}
 finally{cloudPulling=false}
}
function scheduleCloudPush(){
 if(!cloudReady||!cloudUser)return;
 if(cloudPushTimer)clearTimeout(cloudPushTimer);
 cloudPushTimer=setTimeout(()=>{cloudPushTimer=null;cloudPush()},1800);
}
async function cloudPush(){
 if(!cloudReady||!cloudClient||!cloudUser||cloudPushing)return;
 cloudPushing=true;
 try{
   const {error}=await cloudClient.from('concertradar_user_state').upsert({
     user_id:cloudUser.id,payload:cloudSnapshot(),updated_at:new Date().toISOString()
   },{onConflict:'user_id'});
   if(error)throw error;
   cloudStatus='In de privécloud opgeslagen om '+new Date().toLocaleTimeString('nl-NL');
 }catch(e){cloudStatus='Upload mislukt. Lokale gegevens bewaard: '+String(e.message||e)}
 finally{cloudPushing=false;if(state.tab==='sync')render()}
}
async function cloudLogin(){
 const email=String(document.getElementById('cloudEmail')?.value||'').trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Vul een geldig e-mailadres in.');return;}
 if(!await cloudConnect()){render();return;}
 const {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
 cloudStatus=error?'Aanmelden mislukt: '+error.message:'Controleer je e-mail. Open de aanmeldlink op dit apparaat.';
 render();
}
function wireCloud(){
 document.getElementById('cloudLogin')?.addEventListener('click',cloudLogin);
 document.getElementById('cloudNow')?.addEventListener('click',async()=>{await cloudPull();render();});
 document.getElementById('cloudLogout')?.addEventListener('click',async()=>{
   if(cloudClient)await cloudClient.auth.signOut();
   cloudUser=null;cloudReady=false;cloudStatus='Afgemeld';render();
 });
}
