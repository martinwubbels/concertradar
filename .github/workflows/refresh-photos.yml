name: ConcertRadar fotocontrole
on:
  workflow_dispatch:
  schedule:
    - cron: "25 7 * * *"
permissions:
  contents: write
concurrency:
  group: concertradar-photos
  cancel-in-progress: false
jobs:
  photo-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controleer foto's op officiële concertpagina's
        run: python scripts/refresh_photos.py
      - name: Publiceer gewijzigde fotolinks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photos.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatische update officiële concertfoto's"
            git push
          fi
