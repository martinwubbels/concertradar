name: ConcertRadar gegevens uit kandidaten
on:
  workflow_dispatch:
  schedule:
    - cron: "10 8 * * *"
permissions:
  contents: write
concurrency:
  group: concertradar-review
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lees gestructureerde eventgegevens uit officiële pagina's
        run: python scripts/extract_event_details.py
      - name: Bewaar onbevestigde kandidaten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/event-review.json
          if ! git diff --cached --quiet; then
            git commit -m "Controlelijst gevonden concertinformatie"
            git pull --rebase
            git push
          fi
