name: ConcertRadar dagelijkse agenda-controle
on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * *"
permissions:
  contents: write
concurrency:
  group: concertradar-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Doorzoek links in officiële regionale agenda's
        run: python scripts/discover_venues.py
      - name: Publiceer kandidaten en controle-resultaten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Dagelijkse ongewijzigde bronlinks voor controle"
            git pull --rebase
            git push
          fi
